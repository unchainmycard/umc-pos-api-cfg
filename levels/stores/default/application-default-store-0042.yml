# Store 0042 Configuration (Default Tenant)
#
# This profile is activated when CONFIG_PROFILES includes "default,store-0042"
# Overrides tenant-level settings for this specific store.
#
# Used for Tier 1 cluster deployment validation.
#
# See: ADR-P-config-service-020, ADR-P-local-storage-007

# Store identification
store:
  id: store-0042
  name: Tier 1 Validation Store
  format: supermarket

# Spring Data — store-scoped MongoDB override for Tier 1 local deployment
# In a Tier 1 cluster, all services point to the same local MongoDB.
# Each service uses its own database (via service-level config), but the host is shared.
spring:
  data:
    mongodb:
      host: ${MONGODB_HOST:mongodb}
      port: ${MONGODB_PORT:27017}

  # RabbitMQ — local broker in Tier 1 cluster
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

# Eureka zone metadata for locality-aware routing (ADR-P-cascading-gateway-049)
eureka:
  instance:
    metadata-map:
      zone: store-0042
      store-id: store-0042
      store-name: Tier 1 Validation Store
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka}@${EUREKA_HOST:discovery-service}:${EUREKA_PORT:8761}/eureka/

# Logging — more verbose for validation
logging:
  level:
    com.umc.pos: DEBUG
